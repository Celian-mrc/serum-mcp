[project]
name = "serum-mcp"
version = "0.1.0"
description = "Generate, edit and save Xfer Serum 2 presets from natural language, over MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "serum-mcp contributors" }]
keywords = ["mcp", "model-context-protocol", "claude-code", "serum", "synthesizer", "music-production", "ai-music", "sound-design"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "cbor2>=6.1.3",
    "mcp>=1.28.1",
    "pydantic>=2.13.4",
    "zstandard>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/Celian-mrc/serum-mcp"
Issues = "https://github.com/Celian-mrc/serum-mcp/issues"

[project.scripts]
serum-mcp = "serum_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serum_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
